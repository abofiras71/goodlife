<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هندسة الحياة الطيبة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f3;--card:#fff;--ink:#17261f;--mute:#5d6f66;--line:#dde7e1;--g:#0f4c3a;--g2:#1d7a5a;--gold:#b98b24;--soft:#e4f1ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#16231d;--ink:#e8f1ec;--mute:#93a79c;--line:#26382f;--g:#4fc396;--g2:#2f9b75;--gold:#e0b34a;--soft:#1c3128}}
:root[data-theme="dark"]{--bg:#0e1714;--card:#16231d;--ink:#e8f1ec;--mute:#93a79c;--line:#26382f;--g:#4fc396;--g2:#2f9b75;--gold:#e0b34a;--soft:#1c3128}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:26px;font-weight:800;margin:6px 0 2px;color:var(--g)}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.daynav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.daynav button:disabled{opacity:.35}
.daynav div{text-align:center;font-weight:700}
.daynav small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--g)}
.stat span{font-size:12px;color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--gold));width:0;transition:width .3s}
.barlabel{font-size:13px;color:var(--mute);margin-bottom:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
section h2{margin:0;padding:11px 14px;font-size:16px;font-weight:700;background:var(--soft);color:var(--g);display:flex;justify-content:space-between}
section h2 span{font-weight:500;font-size:13px;color:var(--mute)}
label.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:15px;min-height:48px}
label.item input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--g2);border-radius:7px;margin:0;display:grid;place-content:center;cursor:pointer}
label.item input:checked{background:var(--g2)}
label.item input:checked::after{content:"✓";color:#fff;font-size:15px;font-weight:700}
label.item input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.item.on span.t{color:var(--mute);text-decoration:line-through}
.t{flex:1}
.del{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:4px 8px}
.add{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.add input,.add select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);color:var(--ink);min-width:0}
.add input{flex:1}
.add button,.btn{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--g2);color:#fff;padding:9px 14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:12px 14px}
.grid button{aspect-ratio:1;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--mute);font:inherit;font-size:11px;cursor:pointer;padding:0}
.grid button.sel{outline:2px solid var(--gold)}
.hadith{font-size:14px;color:var(--mute);text-align:center;margin:18px 6px 10px}
.foot{display:flex;justify-content:center;gap:10px}
.btn.alt{background:none;color:var(--mute);border:1px solid var(--line);font-weight:500;font-size:13px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<h1>هندسة الحياة الطيبة</h1>
<p class="sub">رفيقك اليومي للصلاة والسنن والأوراد والعادات الحسنة</p>

<div class="daynav">
<button id="prev" aria-label="اليوم السابق">›</button>
<div id="dlabel"></div>
<button id="next" aria-label="اليوم التالي">‹</button>
</div>

<div class="stats">
<div class="stat"><b id="sPct">0%</b><span>إنجاز اليوم</span></div>
<div class="stat"><b id="sStreak">0</b><span>أيام متتالية</span></div>
<div class="stat"><b id="sPts">0</b><span>نقاطك</span></div>
</div>
<div class="bar"><i id="fill"></i></div>
<div class="barlabel" id="blabel"></div>

<div id="groups"></div>

<section>
<h2>آخر 30 يوماً <span>اضغط على يوم لعرضه</span></h2>
<div class="grid" id="grid"></div>
</section>

<p class="hadith">سُئل النبي ﷺ: أي العمل أحب إلى الله؟ قال: أدومه وإن قل</p>
<div class="foot"><button class="btn alt" id="reset">مسح كل البيانات</button></div>
</main>

<script>
var GROUPS=[
{id:'p',name:'الصلوات المفروضة وبعض السنن',items:['سنة الفجر','صلاة الفجر جماعة','ذكر الله أو تلاوة القرآن بعد الفجر','أذكار الصباح','صلاة الضحى','سنة الظهر القبلية والبعدية','صلاة الظهر جماعة','4 ركعات قبل العصر','صلاة العصر جماعة','أذكار المساء','صلاة المغرب','سنة المغرب','صلاة العشاء','سنة العشاء','صلاة الوتر']},
{id:'w',name:'الأوراد اليومية',items:['قراءة القرآن بتدبر','لا إله إلا الله وحده لا شريك له (10)','كثرة الصلاة على رسول الله ﷺ','كثرة الاستغفار','سبحان الله والحمد لله ولا إله إلا الله والله أكبر','كثرة قول لا حول ولا قوة إلا بالله','سبحان الله عدد خلقه ورضا نفسه وزنة عرشه ومداد كلماته']},
{id:'h',name:'عادات وهوايات تعينك على دينك ودنياك',items:['قراءة حديث من أحاديث النبي ﷺ','استماع بودكاست أو موعظة أو سير النبلاء','ممارسة الرياضة','ممارسة هواية تنفعك وتنفع مجتمعك','محاسبة النفس وتزكيتها بلا جلد للذات','القراءة والعلم النافع','كظم الغيظ وترك الغضب','ترك عادة سيئة (الكذب، الغيبة، النميمة...)']}
];
var KEY='goodlife_v1', S={done:{},custom:[]}, cur=today();

function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.done)S=o;if(!S.custom)S.custom=[];}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return key(new Date());}
function parse(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function shift(k,n){var d=parse(k);d.setDate(d.getDate()+n);return key(d);}

function allItems(){
  var out=[];
  GROUPS.forEach(function(g){g.items.forEach(function(t,i){out.push({id:g.id+i,g:g.id,t:t});});});
  S.custom.forEach(function(c){out.push({id:c.id,g:c.g,t:c.t,custom:true});});
  return out;
}
function doneSet(k){return S.done[k]||[];}
function validIds(){var m={};allItems().forEach(function(i){m[i.id]=1;});return m;}
function dayCount(k){var v=validIds();return doneSet(k).filter(function(id){return v[id];}).length;}
function dayPct(k){var n=allItems().length;return n?dayCount(k)/n:0;}

function toggle(id){
  var a=(S.done[cur]||[]).slice(), i=a.indexOf(id);
  if(i>-1)a.splice(i,1);else a.push(id);
  S.done[cur]=a;save();render();
}
function addCustom(g,t){
  t=t.trim();if(!t)return;
  S.custom.push({id:'c'+Date.now(),g:g,t:t});save();render();
}
function delCustom(id){
  S.custom=S.custom.filter(function(c){return c.id!==id;});save();render();
}

function streak(){
  var k=today(), n=0;
  if(dayPct(k)<0.5)k=shift(k,-1);
  while(dayPct(k)>=0.5&&n<3650){n++;k=shift(k,-1);}
  return n;
}
function points(){
  var v=validIds(),t=0;
  Object.keys(S.done).forEach(function(k){t+=S.done[k].filter(function(id){return v[id];}).length;});
  return t;
}
function dayName(k){
  var d=parse(k),t=today();
  var s=d.toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long'});
  return s;
}

function render(){
  var items=allItems(), done=doneSet(cur), c=dayCount(cur), tot=items.length, pct=tot?Math.round(c/tot*100):0;
  document.getElementById('dlabel').innerHTML=(cur===today()?'اليوم':(cur===shift(today(),-1)?'أمس':'يوم سابق'))+'<small>'+dayName(cur)+'</small>';
  document.getElementById('next').disabled=cur>=today();
  document.getElementById('sPct').textContent=pct+'%';
  document.getElementById('sStreak').textContent=streak();
  document.getElementById('sPts').textContent=points();
  document.getElementById('fill').style.width=pct+'%';
  document.getElementById('blabel').textContent='أنجزت '+c+' من '+tot;

  var root=document.getElementById('groups');root.innerHTML='';
  GROUPS.forEach(function(g){
    var list=items.filter(function(i){return i.g===g.id;});
    var gd=list.filter(function(i){return done.indexOf(i.id)>-1;}).length;
    var sec=document.createElement('section');
    var h=document.createElement('h2');h.innerHTML=g.name+'<span>'+gd+'/'+list.length+'</span>';sec.appendChild(h);
    list.forEach(function(it){
      var on=done.indexOf(it.id)>-1;
      var l=document.createElement('label');l.className='item'+(on?' on':'');
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=on;
      cb.addEventListener('change',function(){toggle(it.id);});
      var sp=document.createElement('span');sp.className='t';sp.textContent=it.t;
      l.appendChild(cb);l.appendChild(sp);
      if(it.custom){
        var d=document.createElement('button');d.className='del';d.textContent='✕';d.setAttribute('aria-label','حذف');
        d.addEventListener('click',function(e){e.preventDefault();if(confirm('حذف هذه العادة؟'))delCustom(it.id);});
        l.appendChild(d);
      }
      sec.appendChild(l);
    });
    var f=document.createElement('div');f.className='add';
    var inp=document.createElement('input');inp.placeholder='أضف عادة إلى هذا القسم';inp.maxLength=80;
    var b=document.createElement('button');b.textContent='إضافة';
    b.addEventListener('click',function(){addCustom(g.id,inp.value);});
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')addCustom(g.id,inp.value);});
    f.appendChild(inp);f.appendChild(b);sec.appendChild(f);
    root.appendChild(sec);
  });

  var grid=document.getElementById('grid');grid.innerHTML='';
  for(var i=29;i>=0;i--){
    var k=shift(today(),-i), p=dayPct(k), bt=document.createElement('button');
    bt.textContent=parse(k).getDate();
    if(p>0){bt.style.background='color-mix(in srgb, var(--g2) '+Math.round(20+p*80)+'%, transparent)';bt.style.color=p>0.5?'#fff':'var(--ink)';}
    if(k===cur)bt.className='sel';
    bt.setAttribute('aria-label',dayName(k)+' '+Math.round(p*100)+'%');
    (function(kk){bt.addEventListener('click',function(){cur=kk;render();window.scrollTo(0,0);});})(k);
    grid.appendChild(bt);
  }
}

document.getElementById('prev').addEventListener('click',function(){cur=shift(cur,-1);render();});
document.getElementById('next').addEventListener('click',function(){if(cur<today()){cur=shift(cur,1);render();}});
document.getElementById('reset').addEventListener('click',function(){
  if(confirm('سيتم مسح كل بياناتك من هذا الجهاز. متأكد؟')){S={done:{},custom:[]};save();cur=today();render();}
});
load();render();
</script>
</body>
</html>
